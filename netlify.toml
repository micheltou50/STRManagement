[build]
  functions = "Netlify/functions"

[functions]
  node_bundler = "esbuild"

# ── Scheduled functions ──────────────────────────────────────────────────────
# send-clean-reminders: daily at 10:00 PM UTC = 8:00 AM AEST (UTC+10)
# Adjust cron if your property is in a different timezone:
#   AEDT (UTC+11, Oct–Apr): use "0 21 * * *"
#   AEST (UTC+10, Apr–Oct): use "0 22 * * *"
#
# daily-notifications: morning host digest at 07:00 Sydney — scheduled via Supabase
# pg_cron + net.http_post (see scripts/daily-notifications-cron.sql), not Netlify cron,
# to avoid double-firing alongside Supabase.
[functions."send-clean-reminders"]
  schedule = "0 22 * * *"

[functions."cm-sync-bookings"]
  schedule = "0 */4 * * *"

# Smart Pricing v2 scheduled functions register their cron via the
# `@netlify/functions` schedule() wrapper in the function source itself
# (scheduled-pricing-weekly.js, close-rate-outcomes.js). Declaring them here
# too would create two sources of truth and silent drift if one changes.

[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"
