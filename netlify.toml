[build]
  functions = "Netlify/functions"

[functions]
  node_bundler = "esbuild"

# ── Scheduled functions ──────────────────────────────────────────────────────
# send-clean-reminders: daily at 10:00 PM UTC = 8:00 AM AEST (UTC+10)
# Adjust cron if your property is in a different timezone:
#   AEDT (UTC+11, Oct–Apr): use "0 21 * * *"
#   AEST (UTC+10, Apr–Oct): use "0 22 * * *"
#
# daily-notifications: morning host digest at 07:00 Sydney — scheduled via Supabase
# pg_cron + net.http_post (see scripts/daily-notifications-cron.sql), not Netlify cron,
# to avoid double-firing alongside Supabase.
[functions."send-clean-reminders"]
  schedule = "0 22 * * *"

[functions."cm-sync-bookings"]
  schedule = "0 */4 * * *"

# Smart Pricing v2 — weekly regeneration for every (user, property) with rules.
# Monday 18:30 UTC = Tuesday 04:30–05:30 Sydney (depending on DST).
[functions."scheduled-pricing-weekly"]
  schedule = "30 18 * * 1"

# Smart Pricing v2 — daily outcome close for the feedback loop.
# 14:30 UTC = 00:30–01:30 Sydney; target date is "yesterday (Sydney)".
[functions."close-rate-outcomes"]
  schedule = "30 14 * * *"

[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"
