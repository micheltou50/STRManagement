<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Receipt Prompt Mockup</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --forest: #1E3A2F;
    --moss: #4A7C59;
    --sage: #8FAF85;
    --mist: #F0EDE8;
    --warm: #E8E0D5;
    --stone: #C4B8A8;
    --text: #1A1A1A;
    --text-soft: #6B6B6B;
    --red: #E24B4A;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'DM Sans', sans-serif; background: #f5f3f0; min-height: 100vh; display: flex; align-items: flex-end; justify-content: center; }

  .overlay {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.4); display: flex; align-items: flex-end; justify-content: center;
  }

  @keyframes slideUp {
    from { transform: translateY(100%); }
    to { transform: translateY(0); }
  }

  .panel {
    background: white; border-radius: 16px 16px 0 0; width: 100%; max-width: 500px;
    max-height: 70vh; overflow-y: auto; padding: 20px 16px 24px;
    animation: slideUp 0.32s cubic-bezier(0.32, 0.72, 0, 1);
  }

  .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  .header-title { font-size: 15px; font-weight: 700; color: var(--forest); }
  .header-sub { font-size: 12px; color: var(--text-soft); margin-top: 2px; }
  .close-btn {
    width: 28px; height: 28px; border-radius: 50%; border: none; background: var(--mist);
    font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; color: var(--text-soft);
  }

  .item {
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 0; border-bottom: 0.5px solid rgba(0,0,0,0.06);
  }
  .item:last-of-type { border-bottom: none; }
  .item-desc { font-size: 13px; font-weight: 500; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item-meta { font-size: 11px; color: var(--text-soft); margin-top: 2px; }
  .receipt-btn {
    flex-shrink: 0; margin-left: 10px; padding: 6px 12px; border-radius: 8px;
    border: 1.5px solid var(--forest); background: white; color: var(--forest);
    font-size: 12px; font-weight: 600; cursor: pointer; font-family: 'DM Sans', sans-serif;
    transition: background 0.15s, color 0.15s;
  }
  .receipt-btn:hover { background: var(--forest); color: white; }

  .skip-btn {
    width: 100%; margin-top: 14px; padding: 12px; border-radius: 10px; border: none;
    background: var(--mist); color: var(--text-soft); font-size: 13px; font-weight: 600;
    cursor: pointer; font-family: 'DM Sans', sans-serif;
    transition: background 0.15s;
  }
  .skip-btn:hover { background: var(--warm); }
</style>
</head>
<body>
<div class="overlay">
  <div class="panel">
    <div class="header">
      <div>
        <div class="header-title">Add Receipts</div>
        <div class="header-sub">4 expenses created — attach receipts now or later</div>
      </div>
      <button class="close-btn">×</button>
    </div>

    <div class="item">
      <div style="min-width:0;flex:1">
        <div class="item-desc">2m³ Ironbark firewood split and seasoned</div>
        <div class="item-meta">31 Mar 2026 · $595.00</div>
      </div>
      <button class="receipt-btn">Add Receipt</button>
    </div>

    <div class="item">
      <div style="min-width:0;flex:1">
        <div class="item-desc">Lawn mowing, edge trimming, garden maint</div>
        <div class="item-meta">27 Mar 2026 · $434.50</div>
      </div>
      <button class="receipt-btn">Add Receipt</button>
    </div>

    <div class="item">
      <div style="min-width:0;flex:1">
        <div class="item-desc">Water utility bill payment</div>
        <div class="item-meta">24 Mar 2026 · $234.58</div>
      </div>
      <button class="receipt-btn">Add Receipt</button>
    </div>

    <div class="item">
      <div style="min-width:0;flex:1">
        <div class="item-desc">Completion of Gutter Vacuum Clean</div>
        <div class="item-meta">23 Mar 2026 · $1,045.00</div>
      </div>
      <button class="receipt-btn">Add Receipt</button>
    </div>

    <button class="skip-btn">Skip for Now</button>
  </div>
</div>
</body>
</html>
